---
name: Build livox_sdk_vendor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest
    container: ros:jazzy

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install missing dependencies
        run: |
          sudo apt update
          rosdep update
          DEBIAN_FRONTEND=noninteractive rosdep install \
            --default-yes \
            --from-paths . \
            --ignore-src \
            --rosdistro jazzy

      - name: Build
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon build \
            --event-handlers console_cohesion+ \
            --packages-up-to livox_sdk_vendor

      - name: Run tests
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon test \
            --return-code-on-test-failure \
            --event-handlers console_cohesion+ \
            --packages-up-to livox_sdk_vendor
